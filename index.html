<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>南洋漫游记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f3efe2; --card:#fbf8ee; --ink:#2c3a33; --muted:#6b776b;
  --jade:#4f8571; --deep:#36604f; --sage:#9dbba7; --mint:#dbe8dc;
  --pink:#d99c94; --pink-l:#f3dfd9; --terra:#c07e62; --ochre:#cfa556; --ochre-l:#f1e5c4;
  --turq:#6fa8a2; --turq-l:#d8ebe8; --rose:#9c5557; --rose-l:#f4e2df;
  --hand:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:"Caveat","Comic Sans MS",cursive;
  --tile:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23e5ead9'/><rect x='3' y='3' width='58' height='58' rx='7' fill='none' stroke='%234f8571' stroke-width='1.4'/><g fill='%239dbba7' stroke='%234f8571' stroke-width='.8'><ellipse cx='32' cy='16' rx='6' ry='10'/><ellipse cx='32' cy='48' rx='6' ry='10'/><ellipse cx='16' cy='32' rx='10' ry='6'/><ellipse cx='48' cy='32' rx='10' ry='6'/></g><g fill='%23d99c94'><ellipse cx='32' cy='18' rx='2.6' ry='5'/><ellipse cx='32' cy='46' rx='2.6' ry='5'/><ellipse cx='18' cy='32' rx='5' ry='2.6'/><ellipse cx='46' cy='32' rx='5' ry='2.6'/></g><circle cx='32' cy='32' r='4.5' fill='%23cfa556' stroke='%234f8571' stroke-width='.8'/><g fill='%236fa8a2'><path d='M0 0h13L0 13z'/><path d='M64 0H51l13 13z'/><path d='M0 64h13L0 51z'/><path d='M64 64H51l13-13z'/></g></svg>");
  --tilestrip:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='14' viewBox='0 0 28 14'><rect width='28' height='14' fill='%23e5ead9'/><path d='M7 1l6 6-6 6-6-6z' fill='%239dbba7' stroke='%234f8571' stroke-width='.8'/><path d='M21 1l6 6-6 6-6-6z' fill='%23d99c94' stroke='%234f8571' stroke-width='.8'/><circle cx='7' cy='7' r='1.6' fill='%23cfa556'/><circle cx='21' cy='7' r='1.6' fill='%23cfa556'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .35 0 0 0 0 .25 0 0 0 .07 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
}
.wrap{max-width:540px;margin:0 auto;padding-bottom:100px}
a{color:inherit}
.svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* 手绘描边：真实边框被替换成带抖动滤镜的伪元素 */
.rough{position:relative;isolation:isolate;border:0 !important;background:transparent !important}
.rough::before{content:"";position:absolute;inset:0;border:2px solid var(--ink);border-radius:var(--r,16px);background-color:var(--bg,var(--card));background-image:var(--bgimg,none);filter:url(#rough);pointer-events:none;z-index:-1}
.rough::after{content:"";position:absolute;inset:0;border-radius:var(--r,16px);background:var(--sh,rgba(44,58,51,.14));transform:translate(4px,5px);filter:url(#rough);pointer-events:none;z-index:-2}

/* 顶部 */
.top{position:relative;padding:20px 16px 0;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;background-image:var(--tile);background-size:56px;opacity:.75}
.title-card{--bg:rgba(251,248,238,.96);padding:16px 16px 12px;--r:18px;--sh:var(--jade)}
.title-card h1{margin:0;font-family:var(--hand);font-weight:400;font-size:31px;letter-spacing:2px;line-height:1.15}
.title-card h1 span{color:var(--terra)}
.sub{margin:3px 0 10px;color:var(--muted);font-size:13px}
.flower{position:absolute;width:46px;height:46px;z-index:3}
.flower.f1{right:12px;top:10px;transform:rotate(12deg)}
.flower.f2{right:52px;top:30px;width:30px;height:30px;transform:rotate(-20deg)}
.clocks{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;position:relative;z-index:3}
.clock{text-align:center;padding:5px 2px;background:#fff;border:1.5px dashed var(--ink);border-radius:12px}
.clock b{display:block;font-family:var(--num);font-size:23px;line-height:1.1}
.clock small{font-size:11px;color:var(--muted)}
.clock.local{background:var(--mint);border:2px solid var(--deep)}
.clock.local b{font-size:30px;color:var(--deep)}
.clock.local small:first-child{color:var(--deep);font-weight:600}
.countdown{margin-top:8px;font-size:13px;text-align:center;color:var(--deep);position:relative;z-index:3}
.shophouses{position:relative;display:block;width:100%;height:96px;margin-top:14px}
.five-foot{position:relative;height:14px;background-image:var(--tilestrip);background-size:28px 14px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}

/* 日期条 */
.days{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:64px;text-align:center;padding:7px 4px 8px;cursor:pointer;font-family:inherit;color:inherit;--r:12px;
  --bgimg:linear-gradient(135deg,var(--sage) 9px,transparent 9px),linear-gradient(225deg,var(--sage) 9px,transparent 9px),linear-gradient(45deg,var(--sage) 9px,transparent 9px),linear-gradient(315deg,var(--sage) 9px,transparent 9px)}
.chip .d{font-family:var(--num);font-size:24px;line-height:1}
.chip .w{font-size:12px;color:var(--muted)}
.chip .c{display:inline-block;margin-top:3px;font-size:11px;padding:0 7px;border-radius:9px;color:#fff;background:var(--jade)}
.chip .c.bkk{background:var(--terra)}
.chip .c.sz{background:var(--ochre)}
.chip.on{--bg:var(--mint);transform:translateY(-3px) rotate(-1.5deg);--sh:var(--ink)}
.chip.today .w::after{content:" · 今天";color:var(--rose);font-weight:600}

/* 卡片 */
main{padding:2px 16px}
.tab{display:none}
.tab.active{display:block}
.card{--bg:var(--card);padding:15px 15px 13px;margin:16px 0}
.card h3{margin:0 0 10px;font-family:var(--hand);font-weight:400;font-size:20px;display:flex;align-items:center;gap:7px;color:var(--deep)}
.card h3 .ic{width:24px;height:24px;flex:0 0 auto;color:var(--jade)}
.card h3 .tag{margin-left:auto;font-family:var(--body);font-size:11px;color:var(--muted)}
.dayhead{margin:6px 0 0;padding:4px 2px;display:flex;align-items:flex-end;gap:10px}
.dayhead .t{font-family:var(--hand);font-size:27px;line-height:1.2}
.dayhead .m{color:var(--muted);font-size:13px}
.dayhead .no{font-family:var(--num);font-size:46px;line-height:.9;color:var(--terra)}
.hint{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.ic{display:inline-block;vertical-align:-4px}
.ribbon{display:inline-block;font-family:var(--hand);font-size:13px;padding:1px 10px;background:var(--ochre-l);border:1.5px solid var(--ink);border-radius:10px;transform:rotate(-2deg)}

/* 天气 */
.wx{display:flex;align-items:center;gap:14px}
.wx .ico{font-size:44px;line-height:1}
.wx .tmp{font-family:var(--num);font-size:44px;line-height:1}
.wx .desc{font-size:13px;color:var(--muted)}
.wx-day{margin-top:9px;padding:7px 10px;border-radius:10px;background:var(--mint);font-size:13px}
.wx-more{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12px;padding:2px 9px;border-radius:12px;background:#fff;border:1.5px solid var(--ink)}
.pill.warn{background:var(--ochre-l)}

/* 地图 */
#map{height:250px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#e4e6d6}
#map .leaflet-tile-pane{filter:sepia(.4) saturate(.85) hue-rotate(28deg) brightness(1.03)}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--terra);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.pin span{transform:rotate(45deg);color:#fff;font-family:var(--num);font-size:17px;font-weight:700}
.pin.fixed{background:var(--jade)}
.mapfail{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}

/* 行程 */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;border-left:2px dashed var(--sage)}
.tl li{position:relative;padding:0 0 16px 42px}
.tl .no{position:absolute;left:2px;top:0;width:28px;height:28px;border-radius:50%;background:var(--terra);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:18px;font-weight:700}
.tl .no.fixed{background:var(--jade)}
.tl .no.none{background:var(--card);color:var(--ink)}
.tl .time{font-family:var(--num);font-size:21px;color:var(--turq);margin-right:6px}
.tl .name{font-weight:600}
.badge{display:inline-block;font-size:10px;padding:0 6px;border-radius:8px;margin-left:6px;vertical-align:2px}
.badge.idea{background:var(--ochre-l);color:#7d5d18;border:1px solid var(--ochre)}
.badge.fixed{background:var(--mint);color:var(--deep);border:1px solid var(--jade)}
.tl .d{font-size:13px;color:var(--muted);margin:2px 0 4px}
.tl .go,.tl .tip{font-size:12.5px;margin:2px 0;display:flex;gap:5px;align-items:flex-start}
.tl .go{color:var(--deep)}
.tl .tip{color:#7d5d18}
.lore{margin:6px 0 2px}
.lore summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--deep);list-style:none;display:inline-block;padding:3px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--mint)}
.lore summary::-webkit-details-marker{display:none}
.lore[open] summary{background:var(--ochre-l)}
.lore p{margin:7px 0 0;padding:9px 11px;font-size:13px;line-height:1.75;border:1.5px dashed var(--ink);border-radius:12px;background:var(--card)}
.svgmap{width:100%;height:auto;display:block;background:#e9ecd9}
.svgmap text{font-family:var(--body);font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:#fbf8ee;stroke-width:3px;stroke-linejoin:round}
.svgmap .num{font-family:var(--num);font-size:15px;font-weight:700;fill:#fff;stroke:none}
.mapnote{padding:6px 10px 2px;font-size:11.5px;color:var(--muted);text-align:center}
.tl .go .ic,.tl .tip .ic{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{font-size:12px;text-decoration:none;padding:3px 10px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;white-space:nowrap;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.g{background:var(--turq-l)}
.btn.a{background:var(--mint)}
.btn.x{background:var(--rose-l);color:var(--rose);border-color:var(--rose)}
.btn.solid{background:var(--deep);color:#fff;border-color:var(--deep)}
.btn[disabled]{opacity:.45;cursor:default}

/* 清单 / 待办 */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed rgba(44,58,51,.25)}
.todo li:last-child{border-bottom:0}
.todo input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--jade);flex:0 0 auto}
.todo .txt{flex:1;font-size:14px}
.todo .txt small{display:block;color:var(--muted);font-size:12px}
.todo li.done .txt{text-decoration:line-through;color:var(--muted)}
.todo .del{border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:0 4px}
.addrow{display:flex;gap:6px;margin-top:9px}
.addrow input,.addrow select,.form input,.form select{min-width:0;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
.addrow input{flex:1}
.addrow button,.form button{padding:8px 13px;border:1.5px solid var(--ink);border-radius:12px;background:var(--jade);color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.progress{height:12px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:4px 0 2px}
.progress i{display:block;height:100%;background-image:var(--tilestrip);background-size:24px 12px;transition:width .3s}
.group-title{font-family:var(--hand);font-size:17px;color:var(--terra);margin:12px 0 2px}
.remind{padding:10px 12px;background:var(--ochre-l);border-radius:12px;font-size:13.5px;margin:4px 0}
.remind b{color:#7d5d18}

/* 新闻 */
.news{list-style:none;margin:0;padding:0}
.news li{padding:7px 0;border-bottom:1px dashed rgba(44,58,51,.25);font-size:13.5px}
.news li:last-child{border-bottom:0}
.news a{text-decoration:none}
.news .meta{font-size:11px;color:var(--muted)}
.alert{display:inline-block;background:var(--rose);color:#fff;font-size:10px;padding:0 5px;border-radius:6px;margin-right:4px}
.sos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.sos a{text-decoration:none;font-size:12px;padding:3px 10px;border-radius:12px;background:var(--rose-l);border:1.5px solid var(--rose);color:var(--rose)}
.srcs{display:flex;flex-wrap:wrap;gap:6px}

.notes-btn{display:block;text-align:center;text-decoration:none;font-family:var(--hand);font-size:19px;padding:13px;margin:18px 0;--bg:var(--mint);--sh:var(--ink)}
.notes-btn small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}

/* 美食 / 购物 */
.cityline{margin:16px 0 2px;font-family:var(--hand);font-size:25px;display:flex;align-items:center;gap:8px}
.cityline .ic{width:28px;height:28px;color:var(--terra)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fchip{padding:4px 12px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.fchip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.place{padding:11px 0;border-bottom:1.5px dashed rgba(44,58,51,.28)}
.place:last-child{border-bottom:0}
.place .top2{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.place .nm{font-weight:600;font-size:15px}
.place .dist{margin-left:auto;font-family:var(--num);font-size:18px;color:var(--turq)}
.place .ds{font-size:13px;color:var(--muted);margin:2px 0 2px}
.cat{font-size:10px;padding:0 7px;border-radius:8px;border:1px solid var(--ink)}
.cat.food{background:var(--pink-l)} .cat.coffee{background:#e7dccb} .cat.drink{background:var(--turq-l)} .cat.dessert{background:var(--ochre-l)}
.where{font-size:12px;color:var(--deep)}

/* 锦囊 */
.fx{display:grid;grid-template-columns:1fr auto 1.1fr;gap:8px;align-items:center}
.fx input,.fx select{width:100%;min-width:0;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.fx input{font-family:var(--num);font-size:24px}
.fx select{font-family:var(--body);font-size:14px}
.fx .eq{font-family:var(--num);font-size:26px;color:var(--muted)}
.fxout{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fxout div{text-align:center;padding:6px 2px;border:1.5px dashed var(--ink);border-radius:10px;background:#fff}
.fxout b{display:block;font-family:var(--num);font-size:24px;line-height:1.1;color:var(--deep)}
.fxout small{font-size:11px;color:var(--muted)}
.tips{list-style:none;margin:0;padding:0}
.tips li{padding:7px 0 7px 22px;position:relative;font-size:14px;border-bottom:1px dashed rgba(44,58,51,.22)}
.tips li:last-child{border-bottom:0}
.tips li::before{content:"✿";position:absolute;left:1px;top:6px;color:var(--pink);font-size:14px}
.tips b{color:var(--deep)}
.phr{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.phr .zh{color:var(--muted)}
.phr .say{font-weight:600}
.phr .say small{display:block;font-weight:400;font-size:12px;color:var(--turq)}

/* 钱包 */
.ticket{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 12px;margin:8px 0;background:#fff;border:1.5px solid var(--ink);border-radius:12px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--card);border:1.5px solid var(--ink)}
.ticket::before{left:-8px;clip-path:inset(0 0 0 50%)} .ticket::after{right:-8px;clip-path:inset(0 50% 0 0)}
.ticket .city{font-family:var(--hand);font-size:19px}
.ticket .city small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}
.ticket .mid{text-align:center;font-size:11px;color:var(--muted)}
.ticket .mid .ic{width:26px;height:26px;color:var(--terra)}
.ticket .r{text-align:right}
.ticket .tt{display:block;font-family:var(--num);font-size:28px;line-height:1;color:var(--deep);margin-top:2px}
.ticket .fno{font-family:var(--num);font-size:19px;color:var(--terra);font-weight:700}
.tl .ticket{margin:6px 0 2px}
.tl .no.flt{background:var(--ochre)}
.tl .no.flt .ic{width:16px;height:16px;color:#fff}
.ticket .meta{grid-column:1/-1;border-top:1.5px dashed rgba(44,58,51,.3);padding-top:6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.hotel{padding:10px 0;border-bottom:1.5px dashed rgba(44,58,51,.28)}
.hotel:last-child{border-bottom:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.form .full{grid-column:1/-1}
.ledger{list-style:none;margin:10px 0 0;padding:0}
.ledger li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(44,58,51,.25);font-size:13.5px}
.ledger .amt{margin-left:auto;font-family:var(--num);font-size:19px;color:var(--deep);white-space:nowrap}
.ledger small{color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.sumgrid div{background:#fff;border:1.5px dashed var(--ink);border-radius:10px;padding:6px;text-align:center}
.sumgrid b{display:block;font-family:var(--num);font-size:24px;color:var(--deep);line-height:1.1}
.sumgrid small{font-size:11px;color:var(--muted)}
.settle{font-size:13.5px;padding:4px 0}

/* 给司机看 */
.overlay{position:fixed;inset:0;z-index:2000;background:var(--card);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background-image:var(--tile);background-size:72px}
.overlay.show{display:flex}
.overlay .box{--bg:var(--card);padding:26px 20px;max-width:520px;width:100%;--r:20px}
.overlay .lbl{font-size:14px;color:var(--muted)}
.overlay .big{font-size:30px;font-weight:700;line-height:1.35;margin:10px 0}
.overlay .addr{font-size:22px;line-height:1.5}

/* 底部 tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--paper)}
.tabbar .strip{height:10px;background-image:var(--tilestrip);background-size:20px 10px;border-top:2px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.tabbar .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tb{border:0;background:none;padding:4px 0 2px;cursor:pointer;font-family:var(--hand);font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;--r:14px}
.tb svg{width:25px;height:25px}
.tb.on{color:var(--deep);--bg:var(--mint)}
.tb:not(.on)::before,.tb:not(.on)::after{display:none}

    {t:"18:25", n:"翡翠山历史保护区 Emerald Hill", en:"Emerald Hill Road Singapore", lat:1.3005, lon:103.8385, s:"fixed", d:"1901–1925 年建的联排洋楼，多是娘惹家族住宅，1989 年划为保护区；看点：路口 Peranakan Place 1902 年的六间两层店屋、中式巴洛克花板、彩色花砖、「平多帕加」旋转木门、五脚基走廊；黄昏到天黑灯光下很有气氛", go:"从 Peranakan Place 走上 Emerald Hill Road，沿路慢慢走一圈，约 1 小时", tip:"大多是私人住宅，只在路上拍照，别进院子、别大声说话；天黑后光线弱，手机开夜景模式；我没核对具体门牌，沿着最花的几栋拍就可以"},
    {t:"19:45", n:"晚饭：National Kitchen by Violet Oon（国家美术馆）", en:"National Kitchen by Violet Oon National Gallery Singapore 1 St Andrew's Rd #02-01", lat:1.2903, lon:103.8517, s:"fixed", d:"在 1920 年代的老市政厅大楼二楼（国家美术馆 City Hall 侧翼），Violet Oon 的娘惹菜，有大厅和露台座位，比商场里那家更有历史感；官网上能确认的招牌是 Kunyit Lemak 椰浆姜黄杏鲍菇；其他菜（黑果炖鸡 Ayam Buah Keluak、叻沙、辣椒椰浆虾、海南猪排等）是同一位主厨的招牌，美术馆店的菜单相近，具体以当天为准；晚餐 18:00–22:30，最后点单 21:30", go:"从翡翠山 Grab 约 15–20 分钟（晚上车多可能到 25 分钟）；从 Coleman Street 入口进美术馆，上二楼 #02-01", tip:"提前订位：violetoon.com、电话 +65 9834 9935、或 eat@violetoon.com，订 19:45；价格我没有从官网核到，先别记数字；备选：ION Orchard 的 Violet Oon（#04-12，离翡翠山更近）、Bonding Kitchen（Orchard Gateway #02-18）；吃完从美术馆回 Clarke Quay 只要 7–10 分钟"},
    {t:"21:30", n:"打车回酒店", en:"Paradox Singapore Merchant Court", lat:1.2887, lon:103.8466, s:"idea", d:"美术馆 → Clarke Quay 约 7–10 分钟，大约 21:40 到酒店；也可以沿河慢慢走回去，约 20 分钟；衣服有榴莲味，回房先洗澡", tip:"榴莲味重，穿的衣服先装塑料袋；鱼尾狮不在回酒店的路上，11/25 下午 16:00 去"}
  ], todos:["预约 Peranakan Mansion 11:00 导览（电话 +65 9789 7628）","订 National Kitchen by Violet Oon 19:45 的位子（violetoon.com 或 +65 9834 9935）","带无味湿巾、口香糖、防晒、薄外套","穿舒服的鞋，充电宝带好"]},

  { date:"2026-11-24", city:"sg", title:"警察局 · 福康宁 · 两座博物馆 · 夜间动物园", items:[
    {t:"08:30", n:"Old Hill Street Police Station（彩虹窗大楼）", en:"Old Hill Street Police Station 140 Hill St", lat:1.2900, lon:103.8472, s:"fixed", d:"927 扇彩色窗户的 1934 年老警察局，新加坡最好认的彩色建筑，1998 年成为国家古迹；对面马路退后一点可以拍到全景", go:"从酒店步行约 8–10 分钟，或 Clarke Quay 站走 3 分钟", tip:"一楼有画廊和 Atrium @ MCI，开放时间我没查到，外面拍就够；早上光线柔、人少"},
    {t:"09:00", n:"福康宁公园 Fort Canning Park", en:"Fort Canning Park Singapore", lat:1.2950, lon:103.8458, s:"fixed", d:"24 小时开放，免费；看点：Fort Gate、Spice Garden（180 多种香料植物）、东盟雕塑园、历史花园；约 45 分钟，边逛边往土生博物馆那一侧走", go:"从 Old Hill Street Police Station 往山上走，步行约 5–10 分钟", tip:"早上凉快；山上蚊子多，带驱蚊液；9:50 前要走到 Armenian Street"},
    {t:"10:00", n:"土生华人博物馆", en:"Peranakan Museum 39 Armenian St", lat:1.2942, lon:103.8487, s:"fixed", d:"新加坡最全的土生华人（娘惹 / 峇峇）文化博物馆：嫁妆、珠绣、金饰、婚礼文化，约 1.5–2 小时", go:"从福康宁公园步行约 10 分钟", tip:"每天 10:00–19:00，最晚入场约 18:30；外国游客门票约 S$16（需以官网为准）；11:45 看完后可以去隔壁 Armenian Street 逛逛再走去吃饭"},
    {t:"12:30", n:"午饭：HolyCrab（Capitol）", en:"HolyCrab 13 Stamford Rd #01-85 Capitol Singapore", lat:1.2937, lon:103.8512, s:"fixed", d:"斯里兰卡式螃蟹：绿辣椒蟹、胡椒蟹、配炸馒头；在 Capitol Kempinski 的 13 Stamford Rd #01-85，离土生博物馆步行约 10 分钟，吃完去国家博物馆也顺路", go:"电话 +65 8444 2722，或在 Chope 上订位", tip:"店很小，有评论说常常客满，建议先订 12:30 的位子；人均约 S$40，螃蟹按重量计价，点前问清价格；11/22 在 Jumbo 吃过一次螃蟹，这顿可以点小份；14:00 前要吃完走"},
    {t:"13:45", n:"新加坡国家博物馆", en:"National Museum of Singapore 93 Stamford Rd", lat:1.2966, lon:103.8485, s:"fixed", d:"新加坡最古老的博物馆，约 4 小时，看到 18:00 左右（博物馆 19:00 关门）", go:"从 Capitol 步行约 10–12 分钟", tip:"每天 10:00–19:00，外国游客约 S$15；新加坡历史馆之前有一段时间在整修，目前开放哪些展厅我没查到，去之前看官网（nationalmuseum.nhb.gov.sg）；4 小时较长，可中途去里面的咖啡馆休息"},
    {t:"18:15", n:"去 Sixth Avenue", s:"idea", d:"离开博物馆后打 Grab 约 20–25 分钟（晚高峰可能到 30 分钟），到 18:45 左右"},
    {t:"18:45", n:"晚饭：Kopi House 1990 @ Sixth Ave", en:"Kopi House 1990 24 Sixth Ave Singapore 276481", lat:1.3317, lon:103.7966, s:"fixed", d:"武吉知马的老式咖啡店，主打 CTE 套餐（咖啡、吐司、蛋）、蛋挞、咖喱角", go:"地铁 Downtown 线 Sixth Avenue 站", tip:"每天 5:00–23:00 营业，主要是咖啡店轻食，不算正餐；要赶 20:15 的场次，19:35 出发就来得及，可以吃 45 分钟；园里 18:30 起也有餐厅，可以再补一顿"},
    {t:"19:35", n:"出发去夜间动物园", s:"idea", d:"从 Sixth Avenue 打车约 25–30 分钟（17 点后车费加 S$5 附加费）", tip:"Selegie 挪走后时间松了一些；想更从容也可以买 21:15 场次"},
    {t:"20:15", n:"夜间动物园 Night Safari", en:"Night Safari Singapore 80 Mandai Lake Rd", lat:1.4022, lon:103.7897, s:"fixed", d:"世界首个夜间动物园，场次入场时间 19:15 / 20:15 / 21:15 / 22:15，最晚 23:15，约 3 小时；乘园内小火车约 30 分钟，Creatures of the Night 表演每晚 19:30、20:30、21:30", go:"回程打车约 25–30 分钟，先在 Grab 上叫好；你们约 23:30 离开，00:15 左右到酒店", tip:"门票约 S$58 起，含小火车约 S$64，提前 2–5 天买；动物区禁止闪光灯；今天从早上 8:30 一直在外面，注意体力，晚上冷可以带件外套"}
  ], todos:["订夜间动物园门票（选 20:15 或 21:15 场次）","预订 HolyCrab 12:30 位子（Chope 或电话）","提前查国家博物馆目前开放的展厅","带薄外套、驱蚊液、充电宝（一整天不回酒店）"]},

  { date:"2026-11-25", city:"sg", title:"牛车水 · 鱼尾狮 · 滨海湾花园 · 榴莲鸡火锅", items:[

    {t:"10:00", n:"Tong Mern Sern Antiques Arts & Crafts", en:"Tong Mern Sern 51 Craig Rd", lat:1.2787, lon:103.8428, s:"fixed", d:"三层老排屋，塞满老物件：翡翠白菜、墙上的瓷盘、楼梯上的老打字机、老式梳妆台、能放音乐的古董钟", go:"从东亚步行约 5 分钟；每天 9:00–18:00 营业", tip:"不一定每件都卖，想买先问；拍照前先问店主"},
    {t:"11:30", n:"BabyFang（Tras Link）午饭", en:"Baby Fang 1 Tras Link #01-07", lat:1.2758, lon:103.8457, s:"fixed", d:"印尼 / 南洋风咖啡简餐店，招牌有 Indomie 和鸡饭；在 Tanjong Pagar 的 1 Tras Link #01-07", go:"从 Craig Rd 步行约 10–12 分钟；周二到周五 11:30–15:30、17:30–22:45", tip:"我按这一家排的，如果你说的 BabyFang 是别家（比如别的分店），把地址发我；营业时间来自外卖平台，可能有出入"},
    {t:"12:45", n:"佛牙寺（牛车水的庙）", en:"Buddha Tooth Relic Temple 288 South Bridge Rd", lat:1.2814, lon:103.8441, s:"fixed", d:"牛车水最有名的庙，免费参观，四层殿堂和佛牙舍利", go:"从 Tras Link Grab 约 5 分钟，或步行 15 分钟", tip:"进寺要遮肩、过膝；你说的「牛车水的庙」没写名字，我先排佛牙寺。如果你想去的是 Sri Mariamman（印度庙）或天福宫，告诉我我换掉，它们都在附近"},
    {t:"13:45", n:"大中国 Tai Chong Kok（Sago Street）", en:"Tai Chong Kok 38 Sago St", lat:1.2828, lon:103.8446, s:"fixed", d:"老牌广式饼家，招牌是小猪酥（约 S$2 两个）、坚果月饼；每天 9:30–20:00 营业", go:"从佛牙寺步行约 5 分钟", tip:"买一两样现吃，别买多，今天还要走很多路"},
    {t:"14:15", n:"Chinatown Market Wall · 叶耀聪牛车水壁画", en:"Chinatown wet market mural 30 Temple St", lat:1.2827, lon:103.8440, s:"fixed", d:"Yip Yew Chong（叶耀聪）画的牛车水壁画：Pagoda St 和 Temple St 之间小巷尽头的「湿巴刹」壁画是逛菜市场的场景，可以摆姿势拍照；附近还有「理发」「木屐匠」等壁画", go:"从 Tai Chong Kok 步行约 5 分钟", tip:"壁画在小巷里，拍照时留意来往的人；附近 Smith Street 的 Chinatown Complex 地面层柱子上也有李小龙和招财猫的壁画"},
    {t:"15:00", n:"回酒店休息", en:"Paradox Singapore Merchant Court", lat:1.2887, lon:103.8466, s:"idea", d:"从牛车水回 Clarke Quay 地铁 1 站；洗澡、换衣服、充电，休息 45 分钟", go:"Chinatown 站 → 东北线（紫）Clarke Quay 站，1 站"},
    {t:"16:00", n:"鱼尾狮公园 Merlion Park", en:"Merlion Park One Fullerton 1 Fullerton Rd", lat:1.2868, lon:103.8545, s:"fixed", d:"新加坡的象征，背后是金沙酒店；24 小时开放；11:00–15:00 光线最硬、人最多，16:00 以后好很多，下午到傍晚金沙正面受光，拍照最好", go:"从酒店 Grab 约 10 分钟，或沿河步行约 15–25 分钟", tip:"11/22 的 Bumboat 路线会经过这里，从水上看一遍；今天是在岸上拍近景。最好的位置在雕像正前方，人多时等一两分钟就能等到空档。拍完 16:45 出发去滨海湾花园"},
    {t:"17:15", n:"滨海湾花园 · Golden Garden · 空中走廊", en:"Gardens by the Bay Supertree Grove", lat:1.2816, lon:103.8636, s:"fixed", d:"户外花园免费；天快黑时上 OCBC Skyway（空中走廊）看日落，晚 21:00 关闭，最晚入场 20:30；冷凝馆 Cloud Forest 和花穹 Flower Dome 要买票，最晚入场 20:00 / 20:30", go:"从鱼尾狮公园打 Grab 约 10–15 分钟", tip:"日落约 18:45，先拍照再看灯光秀；Garden Rhapsody 当晚有 19:45 和 20:45 两场，你们看 19:45 的，之后有时间吃火锅"},
    {t:"19:45", n:"Garden Rhapsody 灯光秀", en:"Supertree Grove Gardens by the Bay", lat:1.2816, lon:103.8636, s:"fixed", d:"Supertree 随音乐变灯光，约 15 分钟，免费；躺在地上看最舒服", tip:"圣诞特别版 11/27 才开始，赶不上"},
    {t:"20:30", n:"榴莲鸡火锅：Bafu Durian Chicken", en:"Bafu Durian Chicken 18 Smith Street", lat:1.2831, lon:103.8443, s:"idea", d:"牛车水 Smith Street 18 号，每天 11:00–22:00 营业；招牌用猫山王榴莲、走地鸡、泰国椰青，汤底有榴莲椰青和酸汤两种", go:"灯光秀结束后 Grab 约 20 分钟，也可地铁 Bayfront → Chinatown", tip:"我没查到它的最后点单时间，先电话确认能不能 20:30 到；价格偏贵（$$$$），猫山王点之前问清价格；订不到位备选：回酒店旁 Jumbo 再吃一次，或 Smith Street 上其他小吃"}
  ], todos:["提前订 Bafu 20:30 的位置","买好伴手礼放行李箱，确认行李重量","出发前 3 天内提交泰国 TDAC","今天路线长，穿舒服的鞋；带小电扇或水"]},

    {t:"13:00", n:"Jewel 早到值机 · 寄行李", en:"Jewel Changi Airport Early Check-in Lounge", lat:1.3602, lon:103.9898, s:"fixed", d:"酷航可以在 Jewel 一层的早到值机柜台办，起飞前 3 小时开始、最早可提前 18 小时，办完行李就不用拖着逛了", tip:"柜台在 Jewel 1 楼；先看订单里的托运额度，不含的话现场加购比较贵"},

    {t:"20:30", n:"入住曼谷河畔安凡尼酒店", en:"AVANI+ Riverside Bangkok Hotel", lat:13.7195, lon:100.5040, s:"fixed", d:"阿瓦尼河景房，只住 1 晚", tip:"明早 7:30 左右要退房出发去安帕瓦，今晚就把行李分好：一个小包装 11/27–11/28 两晚用的东西，大箱子放包车"},

const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, def){ try { const v = localStorage.getItem("nanyang:" + k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem("nanyang:" + k, JSON.stringify(v)); } catch(e){} }
};
function ymdIn(tz){ return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function hmIn(tz){ return new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()); }
function mdwIn(tz){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:tz,month:"numeric",day:"numeric",weekday:"short"}).formatToParts(new Date());
  const g = t => (p.find(x => x.type === t) || {}).value;
  const wk = {Sun:"周日",Mon:"周一",Tue:"周二",Wed:"周三",Thu:"周四",Fri:"周五",Sat:"周六"}[g("weekday")];
  return g("month") + "/" + g("day") + " " + wk;
}
function dayObj(date){ const [y,m,d] = date.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); }
function fetchJSON(url, ms){
  const ctl = ("AbortController" in window) ? new AbortController() : null;
  const t = setTimeout(() => ctl && ctl.abort(), ms || 9000);
  return fetch(url, ctl ? {signal:ctl.signal} : {}).then(r => { clearTimeout(t); if (!r.ok) throw new Error(r.status); return r.json(); });
}

function renderClocks(){
  const city = CITIES[curDay().city];
  const rows = [[city.name + " · 当地", city.tz, "local"],["北京","Asia/Shanghai",""],["洛杉矶","America/Los_Angeles",""]];
  $("#clocks").innerHTML = rows.map(r => `<div class="clock ${r[2]}"><small>${r[0]}</small><b>${hmIn(r[1])}</b><small>${mdwIn(r[1])}</small></div>`).join("");
  const today = ymdIn("Asia/Shanghai");
  const start = "2026-11-22", last = DAYS[DAYS.length-1].date;
  let msg;
  if (today < start){
    const n = Math.round((dayObj(start) - dayObj(today)) / 86400000);
    msg = n === 1 ? "✈ 明天就出发啦！" : `✈ 距离出发还有 <b>${n}</b> 天`;
  } else if (today <= last){
    msg = `✿ 旅途第 <b>${Math.round((dayObj(today) - dayObj(start)) / 86400000) + 1}</b> 天`;
  } else msg = "旅程结束啦，记得整理照片";
  $("#countdown").innerHTML = msg;
}

function renderDays(){
  const today = ymdIn("Asia/Shanghai");
  $("#days").innerHTML = DAYS.map((d,i) => {
    const o = dayObj(d.date);
    const tag = d.type === "prep" ? "准备" : CITIES[d.city].name;
    return `<button class="chip rough ${i===state.idx?"on":""} ${d.date===today?"today":""}" data-i="${i}">
      <div class="d">${o.getUTCMonth()+1}/${o.getUTCDate()}</div>
      <div class="w">${WEEK[o.getUTCDay()]}</div>
      <span class="c ${d.city}">${tag}</span></button>`;
  }).join("");
  $("#days").querySelectorAll(".chip").forEach(b => b.onclick = () => selectDay(+b.dataset.i));
  const on = $("#days .chip.on"); if (on) on.scrollIntoView({inline:"center", block:"nearest"});
}

/* ---------- 地图 ---------- */
let map = null, layer = null, leafletState = "loading", tileOk = 0;
function loadLeaflet(){
  return new Promise(res => {
    const srcs = ["https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js","https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"];
    const tryLoad = i => {
      if (i >= srcs.length) return res(false);
      const s = document.createElement("script"); s.src = srcs[i];
      s.onload = () => res(!!window.L); s.onerror = () => tryLoad(i+1);
      document.head.appendChild(s);
    };
    tryLoad(0);
  });
}
function svgMap(el, day, city){
  const pts = []; let n = 0;
  day.items.forEach(p => { if (p.lat == null) return; n++; if (Math.abs(p.lat - city.lat) > 3) return; pts.push({n, p}); });
  if (!pts.length){ el.innerHTML = `<div class="mapfail">今天没有可画的地点</div>`; return; }
  const W = 340, H = 250, pad = 36, k = Math.cos(city.lat * Math.PI / 180);
  const xs = pts.map(o => o.p.lon * k), ys = pts.map(o => -o.p.lat);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const sc = Math.min((W - 2*pad) / Math.max(maxx - minx, 1e-6), (H - 2*pad) / Math.max(maxy - miny, 1e-6), 3000);
  const ox = (W - (maxx - minx) * sc) / 2, oy = (H - (maxy - miny) * sc) / 2;
  pts.forEach((o, i) => { o.x = ox + (xs[i] - minx) * sc; o.y = oy + (ys[i] - miny) * sc; });
  const short = t => (t.replace(/^.*?[：:]/, "").split(/[（(·]/)[0].trim() || t).slice(0, 12);
  const grid = [1,2,3,4].map(i => `<line x1="${i*W/5}" y1="0" x2="${i*W/5}" y2="${H}" stroke="#c9d3b8" stroke-width="1" stroke-dasharray="3 5"/>`).join("") +
               [1,2,3].map(i => `<line x1="0" y1="${i*H/4}" x2="${W}" y2="${i*H/4}" stroke="#c9d3b8" stroke-width="1" stroke-dasharray="3 5"/>`).join("");
  const line = pts.length > 1 ? `<polyline points="${pts.map(o => o.x.toFixed(1) + "," + o.y.toFixed(1)).join(" ")}" fill="none" stroke="#4f8571" stroke-width="2.5" stroke-dasharray="6 7" opacity=".85"/>` : "";
  const placed = [];
  const marks = pts.map(o => {
    const left = o.x > W * 0.6; let ly = o.y + 4;
    for (let t = 0; t < 14; t++){ if (placed.some(q => Math.abs(q.y - ly) < 12 && Math.abs(q.x - o.x) < 130)) ly += 12; else break; }
    placed.push({x: o.x, y: ly});
    return `<g><circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="10" fill="${o.p.s === "fixed" ? "#4f8571" : "#c07e62"}" stroke="#2c3a33" stroke-width="2"/>
      <text class="num" x="${o.x.toFixed(1)}" y="${(o.y + 5).toFixed(1)}" text-anchor="middle">${o.n}</text>
      <text x="${(o.x + (left ? -15 : 15)).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${left ? "end" : "start"}">${esc(short(o.p.n))}</text></g>`;
  }).join("");
  el.innerHTML = `<svg class="svgmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="今日地点示意图">${grid}${line}${marks}</svg>
    <div class="mapnote">示意图，不按真实比例，北在上；要导航请点下面行程里的按钮</div>`;
}
function renderMap(){
  const day = curDay();
  if (day.type === "prep") return;
  const el = $("#map");
  if (leafletState === "loading"){ el.innerHTML = `<div class="mapfail">地图加载中…</div>`; return; }
  const city = CITIES[day.city];
  if (leafletState === "fail"){ svgMap(el, day, city); return; }
  if (!map){
    el.innerHTML = "";
    map = L.map(el, {zoomControl:true, scrollWheelZoom:false});
    const OSM = () => L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"});
    const AMAP = () => L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {subdomains:"1234", maxZoom:18, attribution:"© 高德地图"});
    let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){}
    const inChina = /^Asia\/(Shanghai|Chongqing|Harbin|Urumqi)$/.test(tz) || /^zh-CN/i.test(navigator.language || "");
    const chain = (inChina ? [AMAP, OSM] : [OSM, AMAP]).slice();
    let cur = null, errs = 0;
    const useNext = () => {
      if (cur) map.removeLayer(cur);
      if (!chain.length) return;
      cur = chain.shift()(); errs = 0;
      cur.on("tileerror", () => { if (++errs === 6) useNext(); });
      cur.on("tileload", () => tileOk++);
      cur.addTo(map);
    };
    useNext();
    setTimeout(() => { if (!tileOk && map){ map.remove(); map = null; layer = null; leafletState = "fail"; renderMap(); } }, 10000);
    layer = L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  // 只画和当天城市在同一地区的点（跨城市的机场不连线）
  const pts = []; let n = 0;
  day.items.forEach(p => {
    if (p.lat == null) return;
    n++;
    if (Math.abs(p.lat - city.lat) > 3) return;
    const icn = L.divIcon({className:"", html:`<div class="pin ${p.s==="fixed"?"fixed":""}"><span>${n}</span></div>`, iconSize:[28,28], iconAnchor:[14,28], popupAnchor:[0,-26]});
    L.marker([p.lat,p.lon], {icon:icn}).addTo(layer).bindPopup(`<b>${n}. ${esc(p.n)}</b><br>${esc(p.t)}`);
    pts.push([p.lat,p.lon]);
  });
  if (pts.length > 1) L.polyline(pts, {color:"#4f8571", weight:3, dashArray:"6 8", opacity:.85}).addTo(layer);
  setTimeout(() => {
    map.invalidateSize();
    if (pts.length > 1) map.fitBounds(pts, {padding:[30,30], maxZoom:15});
    else if (pts.length === 1) map.setView(pts[0], 13);
    else map.setView([city.lat, city.lon], 12);
  }, 60);
}

/* ---------- 天气 ---------- */
const WX = c => {
  if (c === 0) return ["☀️","晴"]; if (c === 1) return ["🌤️","大致晴朗"]; if (c === 2) return ["⛅","多云"]; if (c === 3) return ["☁️","阴"];
  if (c === 45 || c === 48) return ["🌫️","雾"]; if (c >= 51 && c <= 57) return ["🌦️","毛毛雨"];
  if (c === 61) return ["🌧️","小雨"]; if (c === 63) return ["🌧️","中雨"]; if (c >= 65 && c <= 67) return ["🌧️","大雨"];
  if (c >= 80 && c <= 82) return ["🌦️","阵雨"]; if (c >= 95) return ["⛈️","雷阵雨"]; return ["🌡️","—"];
};
const wxCache = {};
function renderWeather(){
  const day = curDay(), key = day.city, base = CITIES[key];
  const city = Object.assign({}, base, day.wx || {});
  const wkey = key + (day.wx ? ":" + day.wx.lat : "");
  const box = $("#weather");
  const head = t => `<h3>${icon("sun")}${city.name}${t} <span class="tag">当地 ${hmIn(city.tz)}</span></h3>`;
  const draw = w => {
    if (!w){ box.innerHTML = head("天气") + `<div class="empty">天气暂时获取不到，稍后刷新试试</div>`; return; }
    const c = w.current, [ico, txt] = WX(c.weather_code), D = w.daily;
    const di = D.time.indexOf(day.date), k = di >= 0 ? di : 0;
    const label = di >= 0 ? day.date.slice(5).replace("-","/") : "今天";
    const t = s => (s || "").slice(11,16);
    const rain = D.precipitation_probability_max[k], uv = D.uv_index_max[k], tmax = D.temperature_2m_max[k];
    const adv = [];
    if (rain != null && rain >= 50) adv.push(`<span class="pill warn">☂ 带伞，降雨概率 ${rain}%</span>`);
    if (uv != null && uv >= 8) adv.push(`<span class="pill warn">☀ 紫外线很强，记得防晒</span>`);
    if (tmax != null && tmax >= 31) adv.push(`<span class="pill warn">穿轻薄透气，多补水</span>`);
    let dayLine;
    if (di >= 0){
      const [i2, t2] = WX(D.weather_code[di]);
      dayLine = `<div class="wx-day">${i2} ${label} 预报：${t2}，${Math.round(D.temperature_2m_min[di])}–${Math.round(tmax)}°C，降雨概率 ${rain ?? "—"}%</div>`;
    } else dayLine = `<div class="hint" style="margin-top:8px">这天的预报出发前约两周才出来，现在显示的是${city.name}此刻的天气</div>`;
    box.innerHTML = head("实时天气") + `
      <div class="wx"><div class="ico">${ico}</div><div><div class="tmp">${Math.round(c.temperature_2m)}°</div>
      <div class="desc">${txt} · 体感 ${Math.round(c.apparent_temperature)}° · 湿度 ${c.relative_humidity_2m}% · 风 ${Math.round(c.wind_speed_10m)} km/h</div></div></div>
      ${dayLine}
      <div class="wx-more"><span class="pill">${label} 日出 ${t(D.sunrise[k])}</span><span class="pill">日落 ${t(D.sunset[k])}</span><span class="pill">紫外线 ${uv != null ? Math.round(uv) : "—"}</span>${adv.join("")}</div>`;
  };
  if (wxCache[wkey] && Date.now() - wxCache[wkey].at < 15*60000){ draw(wxCache[wkey].data); return; }
  box.innerHTML = head("天气") + `<div class="empty">加载中…</div>`;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=16`;
  fetchJSON(url).then(d => { wxCache[wkey] = {at:Date.now(), data:d}; if (curDay() === day) draw(d); })
    .catch(() => { if (curDay() === day) draw(null); });
}

const ALERT = /flood|storm|warning|alert|fire|protest|haze|strike|closure|closed|delay|accident|evacuat|earthquake|dengue|outbreak|explosion|attack|shooting|typhoon|heavy rain|disrupt/i;

  box.innerHTML = head + `<div class="empty">加载中…</div>` + tail;

/* ---------- 距离 ---------- */
function km(a, b){
  const R = 6371, r = x => x*Math.PI/180;
  const dLat = r(b[0]-a[0]), dLon = r(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function dayCenter(){
  const key = tabCity(), c = CITIES[key];
  const ps = curDay().city === key ? curDay().items.filter(p => p.lat != null && Math.abs(p.lat - c.lat) < 0.5 && Math.abs(p.lon - c.lon) < 0.5) : [];
  if (!ps.length) return [c.lat, c.lon];
  return [ps.reduce((s,p)=>s+p.lat,0)/ps.length, ps.reduce((s,p)=>s+p.lon,0)/ps.length];
}

      <div class="ds">${esc(f.d)}</div>
      <div class="btns">${navBtns(f)}${xhsBtn(f.n, key)}</div></div>`).join("") || `<div class="empty">这一类还没有推荐</div>`}</div>`;

      () => { alert("没拿到定位，请允许浏览器使用位置"); renderFood(); }, {timeout:10000});
  };
}

/* ---------- 汇率 ---------- */
let fxRates = null, fxState = "idle";
function loadFx(){
  if (fxState !== "idle") return;
  fxState = "loading";
  fetchJSON("https://open.er-api.com/v6/latest/CNY", 9000)
    .then(d => { if (d && d.rates){ fxRates = d.rates; fxState = "ok"; } else fxState = "fail"; })
    .catch(() => { fxState = "fail"; })
    .then(() => { if (state.tab === "tips" || state.tab === "wallet") renderTab(); });
}
const toCNY = (amt, cur) => fxRates && fxRates[cur] ? amt / fxRates[cur] : null;

/* ---------- 锦囊 ---------- */
function renderTips(){
  const key = tabCity(), city = CITIES[key], T = TIPS[key];
  loadFx();
  const tag = fxState === "ok" ? "实时汇率" : fxState === "fail" ? "" : "加载中…";
  const fxCard = `<div class="card rough"><h3>${icon("coin")}汇率换算 <span class="tag">${tag}</span></h3>
    ${fxState==="fail" ? `<div class="empty">汇率暂时获取不到，稍后再试</div>` : `
    <div class="fx"><input id="fxIn" type="number" inputmode="decimal" value="${store.get("fx:"+key,100)}">
      <span class="eq">=</span>
      <select id="fxFrom"><option value="${T.cur}">${T.curName} ${T.cur}</option><option value="CNY">人民币 CNY</option><option value="USD">美元 USD</option></select></div>
    <div class="fxout" id="fxOut"></div>`}</div>`;
  const secs = T.sections.map(s => `<div class="card rough"><h3>${icon(s[0])}${s[1]}</h3><ul class="tips">${s[2].map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("");
  const phr = `<div class="card rough"><h3>${icon("chat")}${T.phrases.title}</h3><div class="phr">${T.phrases.rows.map(r => `<span class="zh">${r[0]}</span><span class="say">${r[1]}</span>`).join("")}</div></div>`;
  const sos = `<div class="card rough"><h3>${icon("phone")}紧急电话</h3><div class="sos" style="margin:0">${city.sos.map(s => `<a href="${s[1]}">${s[0]}</a>`).join("")}</div></div>`;
  $("#tab-tips").innerHTML = `<div class="cityline">${icon("compass")}${city.name} · 旅行锦囊</div><div class="hint">跟着当天所在城市自动切换</div>` + fxCard + secs + phr + sos;
  const calc = () => {
    const out = $("#fxOut"); if (!out) return;
    const amt = parseFloat($("#fxIn").value) || 0, from = $("#fxFrom").value;
    store.set("fx:"+key, amt);
    if (!fxRates){ out.innerHTML = ""; return; }
    const inCNY = amt / fxRates[from];
    out.innerHTML = [[T.cur, T.curName],["CNY","人民币"],["USD","美元"]].filter(c => c[0] !== from).map(c => {
      const v = inCNY * fxRates[c[0]];
      return `<div><b>${v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2)}</b><small>${c[1]} ${c[0]}</small></div>`;
    }).join("");
  };
  if ($("#fxIn")){ $("#fxIn").oninput = calc; $("#fxFrom").onchange = calc; calc(); }
}

/* ---------- 钱包：票夹 + 记账 ---------- */
function showDriver(i){
  const h = HOTELS[i];
  $("#overlayBox").innerHTML = `<div class="lbl">请带我去这里 · Please take me here</div>
    <div class="big">${esc(h.en || h.name)}</div><div class="addr">${esc(h.local || h.addr)}</div>
    ${h.local && h.addr ? `<div class="hint" style="margin-top:10px">${esc(h.addr)}</div>` : ""}
    <div class="hint" style="margin-top:10px">${esc(h.name)}｜司机看不懂就点 Google 地图导航</div>`;
  $("#overlay").classList.add("show");
}
function settle(bal){
  const cred = [], debt = [];
  Object.entries(bal).forEach(([p,v]) => { if (v > 0.5) cred.push([p,v]); else if (v < -0.5) debt.push([p,-v]); });
  const out = [];
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length){
    const x = Math.min(debt[i][1], cred[j][1]);
    out.push(`${esc(debt[i][0])} → ${esc(cred[j][0])}：<b>¥${Math.round(x)}</b>`);
    debt[i][1] -= x; cred[j][1] -= x;
    if (debt[i][1] < 0.5) i++;
    if (cred[j][1] < 0.5) j++;
  }
  return out;
}
function renderWallet(){
  loadFx();
  const key = tabCity(), T = TIPS[key];
  const people = store.get("people", ["我","同伴1","同伴2"]);
  const book = store.get("book", []);

  const tickets = FLIGHTS.map(ticketHTML).join("");
  const hotels = HOTELS.map((h,i) => `<div class="hotel">
      <div><b>${esc(h.place || CITIES[h.city].name)} · ${esc(h.name)}</b></div>
      <div class="hint">${esc(h.dates)} ｜ ${esc(h.room)}</div>
      <div class="hint">${esc(h.addr)}</div>
      <div class="btns"><button class="btn solid" data-drv="${i}">给司机看地址</button>
      <a class="btn g" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.en + " " + h.addr)}" target="_blank" rel="noopener">导航到酒店</a></div></div>`).join("");

  // 记账汇总
  let totalCNY = 0, missing = false;
  const paid = {}; people.forEach(p => paid[p] = 0);
  book.forEach(e => { const v = toCNY(e.amt, e.cur); if (v == null) { missing = true; return; } totalCNY += v; if (paid[e.payer] != null) paid[e.payer] += v; });
  const share = people.length ? totalCNY / people.length : 0;
  const bal = {}; people.forEach(p => bal[p] = paid[p] - share);
  const plan = settle(bal);
  const CATS2 = ["餐饮","交通","门票","购物","住宿","其他"];

  $("#tab-wallet").innerHTML = `<div class="cityline">${icon("wallet")}钱包 · 票夹和账本</div>
    <div class="hint">航班信息也会显示在当天的行程里</div>
    <div class="card rough"><h3>${icon("plane")}航班</h3>${tickets}</div>
    <div class="card rough"><h3>${icon("bed")}酒店</h3>${hotels}
      <div class="hint" style="margin-top:6px">泰文地址请入住前对照订单核实一次；订单号和住客姓名没有放在网页里，请去订单 App 查看</div></div>
    ${tripTipsCard()}
    <div class="card rough"><h3>${icon("receipt")}旅行账本 · AA <span class="tag">只存在这台手机</span></h3>
      <div class="hint">建议由一个人负责记账，最后按结算建议转账</div>
      <div class="sumgrid"><div><b>¥${Math.round(totalCNY).toLocaleString()}</b><small>总花费（折合人民币）</small></div>
        <div><b>¥${Math.round(share).toLocaleString()}</b><small>人均 · ${people.length} 人</small></div></div>
      ${missing ? `<div class="hint">汇率还没加载好，部分外币暂未计入</div>` : ""}
      ${plan.length ? `<div class="group-title">结算建议</div>${plan.map(x => `<div class="settle">${x}</div>`).join("")}` : ""}
      <div class="group-title">记一笔</div>
      <div class="form">
        <input id="bkDesc" class="full" placeholder="买了什么，比如：辣椒螃蟹" maxlength="40">
        <input id="bkAmt" type="number" inputmode="decimal" placeholder="金额">
        <select id="bkCur"><option value="${T.cur}">${T.curName}</option>${["SGD","THB","CNY","USD"].filter(c=>c!==T.cur).map(c=>`<option value="${c}">${{SGD:"新币",THB:"泰铢",CNY:"人民币",USD:"美元"}[c]}</option>`).join("")}</select>
        <select id="bkPayer">${people.map(p => `<option>${esc(p)}</option>`).join("")}</select>
        <select id="bkCat">${CATS2.map(c => `<option>${c}</option>`).join("")}</select>
        <button id="bkAdd" class="full">记下来</button>
      </div>
      <ul class="ledger">${book.slice().reverse().map(e => `<li>
        <div><div>${esc(e.desc || e.cat)}</div><small>${esc(e.day)} · ${esc(e.cat)} · ${esc(e.payer)} 付</small></div>
        <span class="amt">${e.amt.toLocaleString()} ${esc(e.cur)}</span><button class="del" data-id="${e.id}">×</button></li>`).join("") || `<li class="empty" style="border:0">还没有记录</li>`}</ul>
      <div class="group-title">同行成员</div>
      <div class="addrow"><input id="ppl" value="${esc(people.join("，"))}" placeholder="用逗号分隔名字"><button id="pplSave">保存</button></div>
    </div>`;

  $("#tab-wallet").querySelectorAll("[data-drv]").forEach(b => b.onclick = () => showDriver(+b.dataset.drv));
  $("#bkAdd").onclick = () => {
    const amt = parseFloat($("#bkAmt").value);
    if (!amt || amt <= 0){ $("#bkAmt").focus(); return; }
    const d = dayObj(curDay().date);
    book.push({id:Date.now(), desc:$("#bkDesc").value.trim(), amt, cur:$("#bkCur").value, payer:$("#bkPayer").value, cat:$("#bkCat").value, day:`${d.getUTCMonth()+1}/${d.getUTCDate()}`});
    store.set("book", book); renderWallet();
  };
  $("#tab-wallet").querySelectorAll(".ledger .del").forEach(b => b.onclick = () => {
    if (!confirm("删除这一笔？")) return;
    store.set("book", book.filter(e => String(e.id) !== b.dataset.id)); renderWallet();
  });
  $("#pplSave").onclick = () => {
    const list = $("#ppl").value.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean);
    if (list.length){ store.set("people", list); renderWallet(); }
  };
}

function renderTabbar(){
